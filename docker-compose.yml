services:
  postgres:
    image: postgres:16-alpine
    container_name: maternidad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sivigila_maternidad
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sivigila_maternidad_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # Publicado solo en localhost: nadie fuera del servidor puede conectarse directo a la BD
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d sivigila_maternidad"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: maternidad_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # La primera vez, descarga el modelo con:
    #   docker exec maternidad_ollama ollama pull qwen2.5

  ia-service:
    build:
      context: ./IA-SERVICE
    container_name: maternidad_ia_service
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8001:8001"

  backend:
    build:
      context: ./BACKEND
    container_name: maternidad_backend
    restart: unless-stopped
    environment:
      DB_ENGINE: postgresql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: sivigila_maternidad
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      IA_SERVICE_URL: http://ia-service:8001
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      ia-service:
        condition: service_started
    volumes:
      - backend_media:/app/media
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  ollama_data:
  backend_media:
