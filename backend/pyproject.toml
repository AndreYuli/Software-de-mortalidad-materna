[project]
name = "maternanalytics-backend"
version = "0.1.0"
description = "Backend para análisis de mortalidad materna"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.4",
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "pandas==3.0.2",
    "python-dotenv==1.1.1",
    "python-dateutil==2.9.0.post0",
    "scikit-learn==1.6.1",
    "scipy==1.15.1",
    "tzdata==2026.2",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "sqlalchemy==2.0.30",
    "pydantic==2.7.4",
    "pydantic-settings==2.14.1",
    "email-validator==2.1.1",
    "psycopg2-binary==2.9.9",
    "python-multipart==0.0.9",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "PyJWT==2.10.1",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-mock==3.14.0",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
