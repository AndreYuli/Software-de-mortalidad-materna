<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VidaMaterna - Plataforma de Análisis Epidemiológico de Mortalidad y Morbilidad Materna Extrema" />
    <title>VidaMaterna</title>
    <!-- Indicador de carga inicial: el mismo esqueleto que PageSkeleton.tsx, con CSS en línea, para que la
         pantalla no quede en blanco mientras llega el JavaScript y no cambie de apariencia al arrancar React. -->
    <style>
      body { margin: 0; background: #ffffff; }
      #carga-inicial {
        box-sizing: border-box; width: 100%; max-width: 64rem; margin: 0 auto; padding: 24px;
        animation: carga-inicial-pulso 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #carga-inicial > :not(:last-child) { margin-bottom: 16px; }
      #carga-inicial .bloque { background: #e2e8f0; }
      #carga-inicial .titulo { height: 32px; width: 33.333%; border-radius: 8px; }
      #carga-inicial .tarjetas { display: grid; grid-template-columns: 1fr; gap: 16px; }
      #carga-inicial .tarjetas .bloque { height: 96px; border-radius: 12px; }
      #carga-inicial .grafico { height: 256px; border-radius: 12px; }
      #carga-inicial .solo-lectores {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      @media (min-width: 640px) { #carga-inicial .tarjetas { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { #carga-inicial .tarjetas { grid-template-columns: repeat(4, 1fr); } }
      @keyframes carga-inicial-pulso { 50% { opacity: 0.5; } }
      @media (prefers-reduced-motion: reduce) { #carga-inicial { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="carga-inicial" role="status" aria-live="polite" aria-busy="true">
        <span class="solo-lectores">Cargando VidaMaterna…</span>
        <div class="bloque titulo"></div>
        <div class="tarjetas">
          <div class="bloque"></div>
          <div class="bloque"></div>
          <div class="bloque"></div>
          <div class="bloque"></div>
        </div>
        <div class="bloque grafico"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
